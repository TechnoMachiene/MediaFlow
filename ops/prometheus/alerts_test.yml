# promtool test rules ops/prometheus/alerts_test.yml  (runs in CI)
# Feeds synthetic series to the alert rules and asserts exactly which alerts fire, so a typo in
# a metric name can't leave an alert that silently never triggers.
rule_files: [alerts.yml]
evaluation_interval: 1m

tests:
  - name: workers gone
    interval: 1m
    input_series:
      - series: up{job="mediaflow-worker", instance="w1"}
        values: 1 1 0 0 0 0
    alert_rule_test:
      - { eval_time: 1m, alertname: MediaFlowNoWorkers, exp_alerts: [] }
      - eval_time: 5m
        alertname: MediaFlowNoWorkers
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: No queue worker is running - uploads will queue but never be analysed.
              runbook: docs/OPERATIONS.md#mediaflownoworkers

  - name: worker stops, then disappears from service discovery (seen in a real fire drill)
    interval: 1m
    input_series:
      # scrape fails (up=0) for two minutes, then DNS discovery drops the stopped container
      - series: up{job="mediaflow-worker", instance="10.0.0.6:9100"}
        values: 1 1 0 0 stale
    alert_rule_test:
      - { eval_time: 3m, alertname: MediaFlowNoWorkers, exp_alerts: [] }
      - eval_time: 6m
        alertname: MediaFlowNoWorkers
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: No queue worker is running - uploads will queue but never be analysed.
              runbook: docs/OPERATIONS.md#mediaflownoworkers

  - name: no worker was ever discovered
    interval: 1m
    input_series:
      - series: up{job="mediaflow-api", instance="a1"}
        values: 1x10
    alert_rule_test:
      - eval_time: 5m
        alertname: MediaFlowNoWorkers
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: No queue worker is running - uploads will queue but never be analysed.
              runbook: docs/OPERATIONS.md#mediaflownoworkers

  - name: backlog grows, then clears
    interval: 1m
    input_series:
      - series: mediaflow_queue_oldest_ready_age_seconds{instance="api1"}
        values: 0 60 400 460 520 580 640 700 0 0
    alert_rule_test:
      - { eval_time: 3m, alertname: MediaFlowQueueBacklog, exp_alerts: [] }
      - eval_time: 7m
        alertname: MediaFlowQueueBacklog
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: The next job in line has waited 11m 40s since upload.
              runbook: docs/OPERATIONS.md#mediaflowqueuebacklog
      - { eval_time: 9m, alertname: MediaFlowQueueBacklog, exp_alerts: [] }

  - name: failure ratio above 10 percent
    interval: 1m
    input_series:
      - series: mediaflow_job_outcomes_total{outcome="done", instance="w1"}
        values: 0+8x40
      - series: mediaflow_job_outcomes_total{outcome="failed", instance="w1"}
        values: 0+2x40
    alert_rule_test:
      - eval_time: 30m
        alertname: MediaFlowJobFailureRate
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: 20% of finished jobs are failing.
              runbook: docs/OPERATIONS.md#mediaflowjobfailurerate

  - name: healthy fleet raises nothing
    interval: 1m
    input_series:
      - series: up{job="mediaflow-worker", instance="w1"}
        values: 1x20
      - series: up{job="mediaflow-api", instance="a1"}
        values: 1x20
      - series: mediaflow_redis_up{instance="a1"}
        values: 1x20
      - series: mediaflow_job_outcomes_total{outcome="done", instance="w1"}
        values: 0+5x20
    alert_rule_test:
      - { eval_time: 15m, alertname: MediaFlowNoWorkers, exp_alerts: [] }
      - { eval_time: 15m, alertname: MediaFlowAPIDown, exp_alerts: [] }
      - { eval_time: 15m, alertname: MediaFlowRedisDown, exp_alerts: [] }
      - { eval_time: 15m, alertname: MediaFlowJobFailureRate, exp_alerts: [] }

  - name: reconciler rebuilt lost jobs
    interval: 1m
    input_series:
      - series: mediaflow_reconciler_actions_total{action="recovered", instance="w1"}
        values: 0 0 0 2 2 2
    alert_rule_test:
      - eval_time: 5m
        alertname: MediaFlowStoresDiverged
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: The reconciler had to rebuild jobs Redis lost - check Redis persistence.
              runbook: docs/OPERATIONS.md#mediaflowstoresdiverged
