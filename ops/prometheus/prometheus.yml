# Scrapes the private metrics port (METRICS_PORT=9100) of every API and worker container.
# DNS service discovery finds every replica, so `docker compose up --scale worker=3` just works.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: mediaflow-api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 9100
        refresh_interval: 30s

  - job_name: mediaflow-worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
        refresh_interval: 30s
