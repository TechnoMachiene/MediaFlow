# MediaFlow: PostgreSQL + Redis + migrations + API (serves the web app) + queue worker.
#
#   docker compose up -d --build                 # real mode: needs GEMINI_API_KEY etc. in .env
#   docker compose run --rm api python -m app.api.admin you@example.com
#   open http://localhost:8080
#
# Values are read from .env (Compose interpolation) - see .env.example. Only the API port is
# published; PostgreSQL and Redis stay on the private Compose network.

x-app: &app
  build: .
  image: mediaflow:latest
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://mediaflow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 24)}@postgres:5432/mediaflow
    REDIS_URL: redis://redis:6379/0
    QUEUE_PREFIX: ${QUEUE_PREFIX:-ma}
    JWT_SECRET: ${JWT_SECRET:-}
    ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-30}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-}
    GEMINI_RPM: ${GEMINI_RPM:-}
    GEMINI_RPD: ${GEMINI_RPD:-}
    GEMINI_BURST: ${GEMINI_BURST:-1}
    MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
    MEDIA_STORAGE_DIR: /app/uploads
    S3_BUCKET: ${S3_BUCKET:-}
    S3_PREFIX: ${S3_PREFIX:-}
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
    S3_REGION: ${S3_REGION:-}
    S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-}
    S3_SSE: ${S3_SSE:-}
    S3_SSE_KMS_KEY_ID: ${S3_SSE_KMS_KEY_ID:-}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-30}
    MEDIA_RETENTION_MAX_DAYS: ${MEDIA_RETENTION_MAX_DAYS:-0}
    MEDIA_LINK_TTL_S: ${MEDIA_LINK_TTL_S:-300}
    ALLOW_SIGNUP: ${ALLOW_SIGNUP:-0}
    INVITATION_TTL_HOURS: ${INVITATION_TTL_HOURS:-168}
    PUBLISHING_PROVIDERS: ${PUBLISHING_PROVIDERS:-mock}
    PUBLISHING_KEY: ${PUBLISHING_KEY:-}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    # Meta (Facebook Page + Instagram): docs/PUBLISHING.md, "Meta"
    META_PAGE_ID: ${META_PAGE_ID:-}
    META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
    META_INSTAGRAM_ACCOUNT_ID: ${META_INSTAGRAM_ACCOUNT_ID:-}
    META_APP_SECRET: ${META_APP_SECRET:-}
    META_GRAPH_VERSION: ${META_GRAPH_VERSION:-}
    # Email notifications: app/api/notifications.py
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-}
    SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
    FLAGGED_PHRASES_FILE: ${FLAGGED_PHRASES_FILE:-}
    # Capacity per process (docs/OPERATIONS.md, "Capacity")
    DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
    DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
    DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-10}
    API_THREADS: ${API_THREADS:-40}
    PASSWORD_HASH_CONCURRENCY: ${PASSWORD_HASH_CONCURRENCY:-}
    EMBEDDED_WORKER: "0"
    DEMO_MODE: "0"              # the demo has its own file: compose.demo.yaml
    LOG_FORMAT: ${LOG_FORMAT:-json}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    METRICS_PORT: "9100"        # private: not published; scraped by compose.observability.yaml
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
    OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
  volumes:
    - uploads:/app/uploads
    # The Gemini system prompt and its fact sheet: edit prompts/system_prompt.md, then
    # `docker compose restart api worker` (no rebuild needed).
    - ./prompts:/app/prompts:ro

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediaflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 24)}
      POSTGRES_DB: mediaflow
    # Room for several API replicas, each with DB_POOL_SIZE + DB_MAX_OVERFLOW connections, plus
    # the worker (PostgreSQL's default is 100).
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediaflow -d mediaflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Append-only file: queue state survives a container restart.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    # One-shot: no API runs here, so the image's API healthcheck would mark it unhealthy.
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    ports:
      - "${MEDIAFLOW_PORT:-8080}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *app
    command: ["python", "-m", "app.cli", "worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.cli", "stats"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  uploads:
