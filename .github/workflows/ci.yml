name: ci
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
      # Migration chain and the audit trail's append-only trigger (tests/integration/test_postgres.py).
      POSTGRES_TEST_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: { python-version: "3.14", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Unit tests (seconds; fail fast before the slower run)
        run: pytest -m unit
      - name: All tests once, with coverage (unit, integration, PostgreSQL)
        run: pytest -m "not live" --cov --cov-report=term-missing --durations=15
  web:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  e2e:
    # The main user journeys in a real browser (Chromium, desktop and phone) against the real
    # app in demo mode: API, queue, embedded worker, database and the built web app.
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: { python-version: "3.14", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: frontend/playwright-report, retention-days: 7 }
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prometheus config and alert rules are valid, and alerts fire as tested
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/ops/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.7.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/ops/prometheus:/p:ro" -w /p \
            prom/prometheus:v3.7.0 test rules alerts_test.yml
      - name: Dashboard JSON matches its generator
        run: |
          python3 ops/grafana/generate_dashboard.py /tmp/dashboard.json
          diff <(python3 -m json.tool --sort-keys ops/grafana/dashboards/mediaflow.json) \
               <(python3 -m json.tool --sort-keys /tmp/dashboard.json)
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: One-command demo comes up from a clean checkout
        run: docker compose -f compose.demo.yaml up -d --build --wait --wait-timeout 300
      - name: Full demo workflow works without a Gemini key
        run: python3 scripts/demo_check.py http://localhost:8081
      - name: The one-shot migration finished cleanly and is not reported unhealthy
        run: |
          state=$(docker inspect -f '{{.State.ExitCode}} {{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
            "$(docker compose -f compose.demo.yaml ps -a -q migrate)")
          echo "migrate: $state"; test "$state" = "0 none"
      - name: The production stack refuses to start without a database password
        run: |
          if POSTGRES_PASSWORD= docker compose -f compose.yaml config -q 2>/dev/null; then
            echo "compose.yaml accepted an empty POSTGRES_PASSWORD"; exit 1; fi
          POSTGRES_PASSWORD=ci-only-strong-password-0123456789 docker compose -f compose.yaml config -q
      - name: Demo mode refuses to run next to a real key
        run: |
          if docker run --rm -e DEMO_MODE=1 -e GEMINI_API_KEY=not-a-real-key mediaflow:latest \
              python -m app.cli stats; then echo "guard did not fire"; exit 1; fi
      - if: failure()
        run: docker compose -f compose.demo.yaml logs
