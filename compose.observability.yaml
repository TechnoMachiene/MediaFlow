# Observability overlay: Prometheus (metrics + alert rules), Grafana (operations dashboard) and
# Jaeger (traces). Layer it on either stack:
#
#   docker compose -f compose.demo.yaml -f compose.observability.yaml up -d --build --wait
#   docker compose -f compose.yaml      -f compose.observability.yaml up -d --build --wait
#
#   Grafana     http://localhost:3000   dashboard "MediaFlow – Operations" (anonymous viewer)
#   Prometheus  http://localhost:9090   /alerts shows every rule and its state
#   Jaeger      http://localhost:16686  traces: upload request -> queue -> worker -> Gemini
#
# All three are bound to 127.0.0.1 only. Ports are overridable: GRAFANA_PORT, PROMETHEUS_PORT,
# JAEGER_PORT. See docs/OPERATIONS.md for what each alert means and what to do.

services:
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  worker:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

  prometheus:
    image: prom/prometheus:v3.7.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    # No default admin password: GRAFANA_ADMIN_PASSWORD if set, otherwise a random one printed
    # once to `docker compose logs grafana`. Grafana only applies the variable when it first
    # creates its database, so the password is also reset on every start to keep them in sync.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then
          GF_SECURITY_ADMIN_PASSWORD="$$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9')"
          export GF_SECURITY_ADMIN_PASSWORD
          echo "Grafana admin password (random; set GRAFANA_ADMIN_PASSWORD to choose): $$GF_SECURITY_ADMIN_PASSWORD"
        fi
        grafana cli --homepath /usr/share/grafana --config /etc/grafana/grafana.ini \
          admin reset-admin-password "$$GF_SECURITY_ADMIN_PASSWORD" >/dev/null 2>&1 || true
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # read-only viewers; bound to localhost below
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mediaflow.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    restart: unless-stopped
    ports: ["127.0.0.1:${JAEGER_PORT:-16686}:16686"]   # UI; OTLP 4318 stays private

volumes:
  prometheus:
  grafana:
